version: '3.9'

services:
  # ─── PostgreSQL Database ───
  postgres:
    image: postgres:16-alpine
    container_name: docmint-db
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: docmint
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── Redis Cache ───
  redis:
    image: redis:7-alpine
    container_name: docmint-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── Next.js Application ───
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: docmint-app
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/docmint?schema=public
      REDIS_URL: redis://redis:6379
      NODE_ENV: development
      AUTH_SECRET: ${AUTH_SECRET}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      NEXT_PUBLIC_RAZORPAY_KEY_ID: ${NEXT_PUBLIC_RAZORPAY_KEY_ID}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ─── Migration Runner ───
  migrate:
    image: node:20-alpine
    container_name: docmint-migrate
    working_dir: /app
    volumes:
      - ..:/app
    command: >
      sh -c "npm install -g prisma && prisma generate && prisma db push"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/docmint?schema=public
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
