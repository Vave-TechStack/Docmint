# ═══════════════════════════════════════════════════════════════
# DocMint - Production Deployment
# NGINX reverse proxy + Next.js application
# ═══════════════════════════════════════════════════════════════

version: '3.8'

services:
  # ─── Next.js Application ───
  nextjs:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: docmint-nextjs
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET}
      - RAZORPAY_WEBHOOK_SECRET=${RAZORPAY_WEBHOOK_SECRET}
      - AUTH_SECRET=${AUTH_SECRET}
    env_file:
      - ../.env
    volumes:
      - nextjs_cache:/app/.next/cache
    networks:
      - docmint-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ─── NGINX Reverse Proxy ───
  nginx:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.nginx
    container_name: docmint-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/webhook-security.conf:/etc/nginx/webhook-security.conf:ro
      - nginx_cache:/var/cache/nginx
    depends_on:
      nextjs:
        condition: service_healthy
    networks:
      - docmint-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  docmint-network:
    driver: bridge

volumes:
  nextjs_cache:
  nginx_cache:
