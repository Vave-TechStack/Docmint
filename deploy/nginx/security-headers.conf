# ─── Security Headers (included in server/location blocks) ───
# Prevents Nginx add_header inheritance issues
# X-XSS-Protection intentionally omitted (deprecated)
# CSP controlled by application middleware
# HSTS added only in HTTPS server block (Phase C)

add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;