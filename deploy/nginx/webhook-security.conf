# ═══════════════════════════════════════════════════════════════
# DocMint Webhook Security Config
# NGINX rate limiting + IP whitelisting for Razorpay webhook
# ═══════════════════════════════════════════════════════════════

# ─── Rate Limiting Zones ───

# Webhook rate limit: max 10 requests per second per IP
# Burst allows up to 20 concurrent requests, then delays excess
limit_req_zone $binary_remote_addr zone=webhook_limit:10m rate=10r/s;

# Strict rate limit for webhook failures (401/403 responses)
# After 5 failures in 1 minute, block for 5 minutes
limit_req_zone $binary_remote_addr zone=webhook_fail:10m rate=1r/m;

# ─── Razorpay IP Whitelist ───
# Razorpay webhook servers (as per Razorpay docs)
# Ref: https://razorpay.com/docs/webhooks/#test-webhook
geo $razorpay_whitelist {
    default 0;
    
    # Razorpay production webhook IPs
    3.6.117.55   1;
    13.126.72.146 1;
    13.127.115.153 1;
    13.232.116.190 1;
    15.206.19.82  1;
    15.206.74.157 1;
    3.7.18.108    1;
    52.66.67.133  1;
    65.2.34.105   1;
    65.2.34.170   1;
    
    # Allow localhost/dev for testing
    127.0.0.1     1;
    192.168.0.0/16 1;
    10.0.0.0/8    1;
    172.16.0.0/12 1;
}

# ─── Webhook Location Block ───
# Include this in your server block:
# location /api/webhooks/ {
#     include /etc/nginx/webhook-security.conf;
#     proxy_pass http://nextjs:3000;
# }

# IP whitelist check
if ($razorpay_whitelist = 0) {
    return 403;
}

# Rate limiting
limit_req zone=webhook_limit burst=20 nodelay;
limit_req_status 429;

# Additional security headers for webhook responses
add_header X-Webhook-Source "DocMint" always;
add_header X-RateLimit-Limit "10" always;

# Only allow POST method for webhooks
if ($request_method !~ ^POST$) {
    return 405;
}

# Block requests without Razorpay signature header
if ($http_x_razorpay_signature = "") {
    return 401;
}

# Limit body size to 1MB (Razorpay webhook payloads are small)
client_max_body_size 1M;

# Short timeout for webhook responses
proxy_connect_timeout 5s;
proxy_read_timeout 10s;
proxy_send_timeout 10s;
