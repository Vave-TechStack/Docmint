# ═══════════════════════════════════════════════════════════════
# DocMint - NGINX Production Configuration
# Reverse proxy for Next.js with security hardening
# ═══════════════════════════════════════════════════════════════

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

# ─── Rate Limiting Zones ───
# Global rate limit: 100 requests/second per IP
limit_req_zone $binary_remote_addr zone=global_limit:10m rate=100r/s;
limit_req_zone $binary_remote_addr zone=webhook_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;

events {
    worker_connections 1024;
    multi_accept on;
    use epoll;
}

http {
    # ─── Basic Settings ───
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Size limits
    client_max_body_size 50M;
    client_body_buffer_size 128k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;

    # Timeouts
    keepalive_timeout 65;
    keepalive_requests 100;
    client_body_timeout 60s;
    client_header_timeout 60s;
    send_timeout 60s;

    # ─── Logging ───
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main buffer=32k flush=5s;

    # ─── Compression ───
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # ─── Upstream: Next.js App ───
    upstream nextjs {
        server 127.0.0.1:3000;
        keepalive 64;
    }

    # ─── Server Block ───
    server {
        listen 80;
        listen [::]:80;
        server_name vavetechstack.com www.vavetechstack.com;

        # ─── Security Headers ───
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "
            default-src 'self';
            script-src 'self' 'unsafe-inline' 'unsafe-eval' https://checkout.razorpay.com;
            style-src 'self' 'unsafe-inline';
            img-src 'self' data: blob: https:;
            font-src 'self' data:;
            connect-src 'self' https://api.razorpay.com https://api.openai.com;
        " always;

        # ─── Rate Limiting (Global) ───
        limit_req zone=global_limit burst=50 nodelay;
        limit_req_status 429;

        # ─── Webhook Endpoint (Special Handling) ───
        location /api/webhooks/ {
            # Webhook-specific security config
            include /etc/nginx/webhook-security.conf;
            proxy_pass http://nextjs;
        }

        # ─── API Routes ───
        location /api/ {
            proxy_pass http://nextjs;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;

            # Stricter rate limiting for auth endpoints
            location /api/auth/ {
                limit_req zone=login_limit burst=3 nodelay;
                proxy_pass http://nextjs;
            }
        }

        # ─── Static Assets (Cache aggressively) ───
        location /_next/static/ {
            proxy_pass http://nextjs;
            expires 365d;
            add_header Cache-Control "public, immutable";
        }

        location /static/ {
            proxy_pass http://nextjs;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        location /images/ {
            proxy_pass http://nextjs;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # ─── Main App ───
        location / {
            proxy_pass http://nextjs;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        # ─── Deny access to sensitive files ───
        location ~ /\.(?!well-known) {
            deny all;
        }

        location ~ /\.env {
            deny all;
        }

        location ~ /node_modules {
            deny all;
        }

        # ─── Health Check ───
        location /health {
            access_log off;
            return 200 "OK";
            add_header Content-Type text/plain;
        }
    }
}
